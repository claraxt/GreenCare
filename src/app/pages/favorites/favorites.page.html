<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/community"></ion-back-button>
    </ion-buttons>
    <ion-title>Favoriten</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-grid>
    <ion-row>

      <ion-col size="12" size-md="6" *ngFor="let plant of exploreService.favorites">

        <ion-card>

          <ion-card-content>

            <img [src]="plant.image" class="favorite-image">

            <h2>{{ plant.name }}</h2>

            <p>{{ plant.description }}</p>

            <ion-button fill="clear" color="danger" (click)="delete(plant)">
              Löschen
              <ion-icon slot="start" name="trash"></ion-icon>
            </ion-button>

          </ion-card-content>

        </ion-card>

      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
