<ion-content>

  <ion-card class="tip-card">

    <img 
      [src]="tip.image"
      class="tip-image">

    <ion-card-content>

      <h1>
        {{tip.title}}
      </h1>

      <p>
      <ion-icon name="heart-outline"></ion-icon>
        {{ tip.likes }} Likes
     </p>

     <ion-button
      expand="block"
      (click)="likeTip()">

     <ion-icon name="heart-outline"></ion-icon>

      Gefällt mir

      </ion-button>

     </ion-card-content>

  </ion-card>


</ion-content>
